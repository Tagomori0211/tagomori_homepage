apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage-web
  namespace: homepage
  labels:
    app: homepage-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tagomori-homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage-web
  template:
    metadata:
      labels:
        app: homepage-web
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: homepage-web
          # TODO: 静的サイトビルド後のイメージに置換
          image: ghcr.io/tagomori0211/tagomori-homepage:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
