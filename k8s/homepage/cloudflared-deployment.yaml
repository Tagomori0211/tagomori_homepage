# Cloudflare Tunnel — external HTTPS ingress for tagomori_homepage
# Contract: ns=homepage / Service homepage-web:80
# CF Zero Trust Public Hostname should target:
#   http://homepage-web.homepage.svc.cluster.local:80
#
# Token MUST come from a cluster Secret (never inline, never ConfigMap).
# Create Secret out-of-band (see docs/ci-secrets.md). Do not commit real Secret YAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: homepage
  labels:
    app: cloudflare-tunnel
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: tagomori-homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
        app.kubernetes.io/component: ingress
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-secret
                  key: tunnel-token
          ports:
            - name: metrics
              containerPort: 20241
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # NOTE: image is distroless (no shell/wget/ps), so probes must use
          # httpGet against the metrics server rather than exec.
          # "cloudflared tunnel info" (previous probe) always exits non-zero
          # without a tunnel ID argument, which crash-looped this pod.
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
